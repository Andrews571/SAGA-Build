name: "📡 Notify"

on:
  push:
    branches:
      - '**'   # explicit: match every branch push (required once tags-ignore is set)
    tags-ignore:
      - '**'   # ignore tag pushes (e.g. the "cache" release tag) — only real branch commits notify

permissions:
  contents: read

jobs:

  # ======================================================
  # 📌 PUSH EVENT
  # ======================================================
  on-push:
    name: "Push"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # needs the pre-push commit for the +x/-y diff stats

      - name: "📌 Notify Push"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID_EVENT: ${{ vars.TELEGRAM_THREAD_ID_EVENT }}
          COMMIT:       ${{ github.sha }}
          BEFORE:       ${{ github.event.before }}
          BRANCH:       ${{ github.ref_name }}
          MESSAGE:      ${{ github.event.head_commit.message }}
          AUTHOR:       ${{ github.event.head_commit.author.name }}
          URL:          ${{ github.event.head_commit.url }}
        run: bash "$GITHUB_WORKSPACE/release/telegram/push_notify.sh"
