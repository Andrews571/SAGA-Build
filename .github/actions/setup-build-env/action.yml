name: "Setup Build Environment"
description: "Restore-only: clang, arsenal, ccache, and LTO caches for Start-Build job"

inputs:
  build-system:
    required: true
  kernel-version:
    required: true
  kernel-source:
    required: true
  ref-name:
    required: true
  kernel-variant:
    required: true
  susfs:
    required: true
  lto-mode:
    required: true
  gh-token:
    required: true

outputs:
  clang-variant:
    description: "Stripped clang variant name (e.g. Cirrus, Neutron)"
    value: ${{ steps.clang-key.outputs.clang_variant }}
  clang-variant-upper:
    description: "Uppercased clang variant (e.g. NEUTRON) — for cache asset filenames only, not cache keys"
    value: ${{ steps.clang-key.outputs.clang_variant_upper }}

runs:
  using: composite
  steps:
    - name: "Derive Runner Image"  # keep in sync with setup-arsenal
      id: runner-img
      shell: bash
      # ImageOS (ubuntu22/ubuntu24/...) is a runner env var, not reachable from
      # workflow expressions. Native binaries cached below (ccache-ECS is built
      # from source, clang gets glibc-patched) only run on the image family they
      # were built on — a mismatch fails with "GLIBC_x.y not found".
      run: echo "image=${ImageOS:-unknown}" >> $GITHUB_OUTPUT

    - name: "Derive Clang Variant"  # keep in sync with setup-arsenal
      id: clang-key
      if: startsWith(inputs.build-system, 'Make')
      shell: bash
      run: |
        variant="${{ inputs.build-system }}"
        variant="${variant#Make - }"
        echo "clang_variant=${variant}" >> $GITHUB_OUTPUT
        echo "clang_variant_upper=${variant^^}" >> $GITHUB_OUTPUT

    - name: "Restore Clang Cache"
      if: startsWith(inputs.build-system, 'Make')
      uses: actions/cache/restore@v6
      with:
        path: ~/clang-cache
        key: clang-${{ steps.clang-key.outputs.clang_variant }}-${{ steps.runner-img.outputs.image }}

    - name: "Restore Arsenal Cache"
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/ccache-bin
          ~/ak3-cache
          ~/kernel-cache
          ~/.apt-cache
        # Must match setup-arsenal's "Cache Arsenal" key exactly (see the
        # comment there) or this silently misses every time.
        key: arsenal-MAKE-${{ inputs.kernel-version }}-${{ inputs.kernel-source }}-${{ steps.runner-img.outputs.image }}

    - name: "Restore ccache"
      if: startsWith(inputs.build-system, 'Make')
      uses: ./.github/actions/restore-caches
      with:
        # Must match the Save step's ccache-filename in build.yml exactly
        # (same field order, same susfs/mode handling) or restore silently
        # misses the asset the save step actually wrote.
        ccache-filename: ccache-data-${{ inputs.kernel-version }}-${{ inputs.kernel-variant }}${{ inputs.susfs == 'true' && '+SUSFS' || '' }}-${{ steps.clang-key.outputs.clang_variant_upper }}${{ inputs.lto-mode != 'NONE' && format('-{0}', inputs.lto-mode) || '' }}-${{ inputs.ref-name }}.tar.zst
        gh-token: ${{ inputs.gh-token }}

    - name: "Restore LTO Cache"
      if: startsWith(inputs.build-system, 'Make') && inputs.lto-mode == 'THIN'
      uses: ./.github/actions/restore-lto-cache
      with:
        # Must match the Save step's lto-asset-name in build.yml exactly.
        asset-name: lto-data-${{ inputs.kernel-version }}-${{ inputs.kernel-variant }}${{ inputs.susfs == 'true' && '+SUSFS' || '' }}-${{ steps.clang-key.outputs.clang_variant_upper }}${{ inputs.lto-mode != 'NONE' && format('-{0}', inputs.lto-mode) || '' }}-${{ inputs.ref-name }}.tar.zst
        gh-token:   ${{ inputs.gh-token }}
