name: "Setup Arsenal"
description: "Restore clang + arsenal cache (auto-saved at end of job if missing) for prepare-matrix job"

inputs:
  build-system:
    required: true
  kernel-version:
    required: true
  kernel-source:
    required: true
  update-arsenal:
    required: true
  gh-token:
    required: true

outputs:
  clang-variant:
    description: "Stripped clang variant name (e.g. Cirrus, Neutron)"
    value: ${{ steps.clang-key.outputs.clang_variant }}

runs:
  using: composite
  steps:
    - name: "Derive Clang Variant"  # keep in sync with setup-build-env
      id: clang-key
      if: startsWith(inputs.build-system, 'Make')
      shell: bash
      run: |
        variant="${{ inputs.build-system }}"
        variant="${variant#Make - }"
        echo "clang_variant=${variant}" >> $GITHUB_OUTPUT

    - name: "Force Refresh (delete old caches)"
      if: inputs.update-arsenal == 'yes'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        gh cache delete "arsenal-MAKE-${{ inputs.kernel-version }}-${{ inputs.kernel-source }}" -R "${{ github.repository }}" 2>/dev/null || true
        if [ "${{ startsWith(inputs.build-system, 'Make') }}" = "true" ]; then
          gh cache delete "clang-${{ steps.clang-key.outputs.clang_variant }}" -R "${{ github.repository }}" 2>/dev/null || true
        fi

    - name: "Cache Clang"  # restores if present; auto-saves at end of job if it was missing
      if: startsWith(inputs.build-system, 'Make')
      uses: actions/cache@v6
      with:
        path: ~/clang-cache
        key: clang-${{ steps.clang-key.outputs.clang_variant }}

    - name: "Cache Arsenal"  # restores if present; auto-saves at end of job if it was missing
      uses: actions/cache@v6
      with:
        path: |
          ~/ccache-bin
          ~/ak3-cache
          ~/kernel-cache
          ~/.apt-cache
        # kernel-source in the key too, not just kernel-version — mirror
        # and live are different git histories entirely (same version
        # number can mean different trees), a cached ~/kernel-cache from
        # one must never get served for the other.
        key: arsenal-MAKE-${{ inputs.kernel-version }}-${{ inputs.kernel-source }}

    - name: "Run Arsenal"
      shell: bash
      working-directory: ${{ github.workspace }}
      # Composite action inputs (inputs.*) are usable inside this action.yml
      # but are NOT auto-exposed as env vars to a `run:` step's shell — that
      # gap is exactly why arsenal.sh ran with KERNEL_SOURCE unset for as
      # long as it did (silently masked by its own fallback default, which
      # is why it went undetected: every run "worked", just sometimes
      # against the wrong branch). Every var arsenal.sh/functions.sh reads
      # from the environment must be listed here explicitly — the job-level
      # `env:` in build.yml's prepare-matrix does NOT reach into this
      # composite action's steps.
      env:
        KERNEL_SOURCE: ${{ inputs.kernel-source }}
      run: bash arsenal.sh
