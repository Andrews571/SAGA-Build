name: "Restore ccache"
description: "Restore ccache from GitHub Release"

inputs:
  ccache-filename:
    required: true
  fallback-filenames:
    description: "Comma-separated asset names tried, in order, when ccache-filename does not exist (seed from a sibling cache). ccache is content-addressed, so a sibling's entries are always safe to reuse."
    required: false
    default: ""
  gh-token:
    required: true
runs:
  using: composite
  steps:
    - name: "♻️ Restore ccache from Release"
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        IN_CCACHE_FILENAME: ${{ inputs.ccache-filename }}
        IN_FALLBACKS: ${{ inputs.fallback-filenames }}
        REPO: ${{ github.repository }}
      run: |
        cd "${{ github.workspace }}"
        if ! gh release view cache --repo "$REPO" > /dev/null 2>&1; then
          echo "⚠️ Cache release not found — starting cold"
          exit 0
        fi
        candidates=("${IN_CCACHE_FILENAME}")
        IFS=',' read -ra fb <<< "${IN_FALLBACKS:-}"
        for f in "${fb[@]}"; do [ -n "$f" ] && [ "$f" != "$IN_CCACHE_FILENAME" ] && candidates+=("$f"); done
        for ASSET_NAME in "${candidates[@]}"; do
          echo "Checking for ccache asset: ${ASSET_NAME}"
          rm -f "/tmp/${ASSET_NAME}"
          if gh release download cache --repo "$REPO" --pattern "${ASSET_NAME}" --dir /tmp/ 2>/dev/null && [ -f "/tmp/${ASSET_NAME}" ]; then
            label="own cache"
            [ "$ASSET_NAME" != "$IN_CCACHE_FILENAME" ] && label="SEEDED from sibling cache"
            echo "Restoring ccache from ${ASSET_NAME} (${label})..."
            if tar --zstd -xf "/tmp/${ASSET_NAME}"; then
              rm -f "/tmp/${ASSET_NAME}"
              echo "ccache restored ✅ (${label})"
              [ "$label" != "own cache" ] && echo "::notice title=ccache::own cache missing or unusable — seeded from ${ASSET_NAME}"
              exit 0
            fi
            echo "❌ Failed to extract ${ASSET_NAME} — trying the next candidate"
            rm -f "/tmp/${ASSET_NAME}"
          fi
        done
        echo "⚠️ ccache asset not found (${IN_CCACHE_FILENAME}, ${#candidates[@]} candidate(s) tried) — starting cold"
        exit 0
